[project]
name = "fixora"
version = "0.1.0"
description = "Task-driven AI code repair platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "cryptography>=44",
  "dramatiq[redis]>=1.17",
  "fastapi>=0.115",
  "httpx>=0.28",
  "openai>=1.68",
  "openai-agents>=0.0.16",
  "playwright>=1.51",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.8",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fixora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"fixora/http/api.py" = ["B008"]
